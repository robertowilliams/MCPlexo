[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-llm-bridge"
version = "0.1.0"
description = "A bridge that lets OpenAI-compatible LLMs call tools exposed by MCP servers (plus a local SQLite tool)."
authors = [{ name = "Roberto Batista" }]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
  "openai>=1.30.0",
  "mcp>=0.1.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
  # pretty logging if you want it (optional; remove if unused in your code paths)
  "colorlog>=6.8.2",
]

[project.urls]
Homepage = "https://github.com/robertowilliams/MCPlexo"

[project.scripts]
mcp-llm-bridge = "mcp_llm_bridge.main:main"

# If you’re using src/ layout:
[tool.setuptools.packages.find]
where = ["src"]
include = ["mcp_llm_bridge*"]
exclude = ["tests*"]

[tool.setuptools]
package-dir = {"" = "src"}
